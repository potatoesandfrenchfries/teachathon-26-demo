[project]
name = "teachathon-backend"
version = "0.1.0"
description = "Backend for the TeachAThon 2026 adaptive mastery-learning app"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.uv]
# The code is imported as `backend.*` from the repo root, so it is not installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `import backend` works when pytest runs from backend/.
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
